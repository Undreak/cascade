[project]
name = "cascade"
version = "0.1.0"
description = "Learning-oriented turbulence simulations: mixing-length RANS, 2D/3D pseudo-spectral DNS, spectral diagnostics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "h5py>=3.11",
]

[project.optional-dependencies]
fftw = ["pyfftw>=0.14"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "NPY", # numpy-specific
    "PT",  # pytest style
    "SIM", # simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle (numpy convention below)
]
ignore = [
    "RUF001", # Greek letters (ν, κ, ω, ...) in strings are intended
    "RUF002", # ... in docstrings
    "RUF003", # ... in comments
    "D401",   # noun-phrase summaries ("Shell-summed spectrum ...") read better for math
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]
